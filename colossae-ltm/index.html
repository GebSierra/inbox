<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Colossae LTM</title>
<style>
  :root{--ink:#3b2a1c;--paper:#f4ead6;--terra:#b8583a}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9d9bd;font-family:Georgia,serif;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(244,234,214,.92);color:var(--ink);
       border:1px solid #c9b48f;border-radius:10px;padding:8px 16px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18);
       max-width:calc(100vw - 32px);pointer-events:none}
  #hud .z{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}
  #hud .s{font-size:18px}
  #nav{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}
  #nav button,#mapbtn{font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1px solid #c9b48f;border-radius:8px;padding:9px 14px;cursor:pointer}
  #mapbtn{position:fixed;right:16px;top:14px}
  #joy{position:fixed;left:24px;bottom:24px;width:110px;height:110px;border-radius:50%;background:rgba(244,234,214,.35);border:2px solid rgba(244,234,214,.8)}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(244,234,214,.9)}
  #help{position:fixed;left:16px;top:14px;font-size:12px;color:var(--ink);background:rgba(244,234,214,.75);padding:6px 10px;border-radius:8px}
  @media (pointer:fine){#joy{display:none}}
  @media (max-width:600px){#help{display:none}#hud .s{font-size:15px}}
</style>
</head>
<body>
<div id="hud"><div class="z">Colossae</div><div class="s">Walk to the city gate</div></div>
<div id="help">WASD / arrows to walk · drag to look · double-click to go there · N / P jump stations</div>
<button id="mapbtn">Dollhouse</button>
<div id="nav"><button id="prev">◀ Prev</button><button id="next">Next ▶</button></div>
<div id="joy"><div id="knob"></div></div>
<script type="module">
import * as THREE from './three.module.js';

// ---------- deterministic random ----------
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const R = (a, b) => a + rnd() * (b - a);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color('#f1dcbc');
scene.fog = new THREE.Fog(SKY, 220, 560);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 900);

// sky dome gradient
{
  const g = new THREE.SphereGeometry(800, 32, 16);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color('#9fbfd6') }, bot: { value: new THREE.Color('#f6dfba') } },
    vertexShader: 'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 top,bot;varying float h;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(0.,.55,h)),1.);}' });
  scene.add(new THREE.Mesh(g, m));
}
scene.add(new THREE.HemisphereLight('#fff1d8', '#a89a78', 1.6));
const sun = new THREE.DirectionalLight('#ffd9a8', 2.6);
sun.position.set(-90, 70, 50); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 1, far: 400 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
scene.add(sun); sun.target.position.set(20, 0, 10); scene.add(sun.target);

// ---------- materials ----------
const M = {};
const mat = (k, c, o = {}) => (M[k] ??= new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .9, ...o }));
mat('wall', '#efe6d4'); mat('wallTrim', '#d8c7a6'); mat('roof', '#c4663f'); mat('roofDk', '#a85434');
mat('stone', '#bfb2a0'); mat('stoneDk', '#9e9282'); mat('wood', '#7a5434'); mat('woodLt', '#9a7048');
mat('leaf', '#7c9450'); mat('leafDk', '#5f7a3e'); mat('cypress', '#4f6a38'); mat('trunk', '#6b4a32');
mat('marble', '#f2ede2'); mat('path', '#d3bd95'); mat('cobble', '#b9ad9a'); mat('window', '#6e5640');
mat('travertine', '#f4f1ea'); mat('wool', '#f3efe6'); mat('dark', '#3a2c22'); mat('clay', '#b9693f'); mat('basket', '#c9a564');

const add = (geo, m, x = 0, y = 0, z = 0, parent = scene) => {
  const mesh = new THREE.Mesh(geo, typeof m === 'string' ? M[m] : m);
  mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh;
};
const box = (w, h, d, m, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), m, x, y + h / 2, z, p);
const cyl = (rt, rb, h, s, m, x, y, z, p) => add(new THREE.CylinderGeometry(rt, rb, h, s), m, x, y + h / 2, z, p);

// ---------- terrain ----------
const RIVER_X = z => 58 + Math.sin(z * 0.035) * 9 + Math.sin(z * 0.011 + 1) * 6;
function hRaw(x, z) {
  let h = Math.sin(x * 0.03) * 1.6 + Math.cos(z * 0.025) * 1.4 + Math.sin((x + z) * 0.05) * 0.6;
  const d = Math.hypot(x - 10, z - 15);
  h += Math.max(0, d - 95) * 0.12;                         // rolling hills outside town
  const rd = Math.abs(x - RIVER_X(z));
  if (rd < 22) h -= Math.min(1, (1 - rd / 22) * 1.6) * 4.6;              // river valley
  return h;
}
const TOWN = (x, z) => Math.max(0, 1 - Math.max(0, Math.hypot(x - 15, z - 15) - 65) / 25); // flatten town
const heightAt = (x, z) => {
  const h = hRaw(x, z); const rd = Math.abs(x - RIVER_X(z));
  if (rd < 22) return h; return h * (1 - TOWN(x, z) * 0.85);
};
{
  const S = 520, N = 300;
  const g = new THREE.PlaneGeometry(S, S, N, N); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [];
  const cGrass = new THREE.Color('#9db163'), cGrass2 = new THREE.Color('#86a053'), cDirt = new THREE.Color('#d6c08f'), cBank = new THREE.Color('#ece6d6');
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + 15, z = p.getZ(i) + 15; p.setX(i, x); p.setZ(i, z);
    const y = heightAt(x, z); p.setY(i, y);
    const c = cGrass.clone().lerp(cGrass2, (Math.sin(x * .13) * Math.cos(z * .11) + 1) / 2);
    const rd = Math.abs(x - RIVER_X(z));
    if (rd < 13) c.lerp(cBank, Math.min(1, 1 - Math.max(0, rd - 9) / 4));
    if (Math.hypot(x - 15, z - 15) < 60 && rd > 14) c.lerp(cDirt, 0.55);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const t = add(g.toNonIndexed(), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  t.castShadow = false; t.geometry.computeVertexNormals();
}
// river water
{
  const pts = [], W = 9;
  const g = new THREE.BufferGeometry(); const pos = [];
  for (let z = -240; z <= 260; z += 4) pts.push(z);
  for (let i = 0; i < pts.length - 1; i++) {
    const z0 = pts[i], z1 = pts[i + 1], x0 = RIVER_X(z0), x1 = RIVER_X(z1), y = -1.7;
    pos.push(x0 - W, y, z0, x0 + W, y, z0, x1 - W, y, z1, x0 + W, y, z0, x1 + W, y, z1, x1 - W, y, z1);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const w = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: '#86d4d6', roughness: .3, metalness: 0, transparent: true, opacity: .95, side: THREE.DoubleSide }));
  w.receiveShadow = true; scene.add(w);
  // travertine ledges
  for (let z = -200; z < 220; z += 3.2) for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
    if (Math.abs(z - 2) < 4) continue;
    const x = RIVER_X(z) + s * (9 + k * 2.2 + R(-.3, .3)); if (heightAt(x, z) < -1.6) continue;
    const m = box(R(1.2, 1.7), .22, R(1.8, 2.6), 'travertine', x, Math.max(-1.75, heightAt(x, z) - .25), z); m.rotation.y = R(-.2, .2);
  }
}
// mountains
function mountain(x, z, r, h, c) {
  const g = new THREE.ConeGeometry(r, h, 9, 4); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { if (p.getY(i) < h / 2 - .01) { p.setX(i, p.getX(i) * R(.8, 1.15)); p.setZ(i, p.getZ(i) * R(.8, 1.15)); p.setY(i, p.getY(i) + R(-h * .06, h * .06)); } }
  g.computeVertexNormals();
  const m = add(g, new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 1 }), x, h / 2 - 6, z); m.castShadow = false;
}
mountain(20, -420, 150, 200, '#9c8a74'); mountain(-120, -390, 110, 130, '#958670'); mountain(160, -400, 120, 150, '#a08e76');
for (let i = 0; i < 9; i++) mountain(-200 + i * 55, -250 + R(-20, 20), R(45, 70), R(25, 45), '#8fa060');
mountain(-210, -150, 90, 80, '#a6a483'); mountain(260, -140, 100, 90, '#a6a483'); mountain(-60, -340, 80, 150, '#9c8d7a');

// ---------- props ----------
function tree(x, z, s = 1) {
  const y = heightAt(x, z), g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
  cyl(.18 * s, .28 * s, 2.2 * s, 5, 'trunk', 0, 0, 0, g);
  for (let i = 0; i < 4; i++) {
    const m = add(new THREE.IcosahedronGeometry(R(1.1, 1.6) * s, 0), i % 2 ? 'leaf' : 'leafDk', R(-.9, .9) * s, (2.6 + R(0, 1.1)) * s, R(-.9, .9) * s, g);
    m.rotation.set(R(0, 3), R(0, 3), 0);
  }
}
function cypress(x, z, s = 1) {
  const y = heightAt(x, z);
  cyl(.15, .2, 1, 5, 'trunk', x, y, z);
  const m = add(new THREE.ConeGeometry(1 * s, 7 * s, 6), 'cypress', x, y + 1 + 3.5 * s, z); m.scale.x = .8;
}
function sheep(x, z) {
  const g = new THREE.Group(); g.position.set(x, heightAt(x, z), z); g.rotation.y = R(0, 6); scene.add(g);
  const b = add(new THREE.IcosahedronGeometry(.55, 0), 'wool', 0, .7, 0, g); b.scale.set(1.3, .9, 1);
  box(.3, .35, .3, 'dark', .72, .6, 0, g);
  for (const [a, c] of [[.4, .25], [.4, -.25], [-.4, .25], [-.4, -.25]]) box(.1, .45, .1, 'dark', a, 0, c, g);
}
function stoneWall(x0, z0, x1, z1, h = 1) {
  const L = Math.hypot(x1 - x0, z1 - z0), n = Math.ceil(L / 2.2);
  for (let i = 0; i < n; i++) {
    const t = (i + .5) / n, x = x0 + (x1 - x0) * t, z = z0 + (z1 - z0) * t;
    const m = box(L / n * 1.02, h * R(.85, 1.1), .8, i % 3 ? 'stone' : 'stoneDk', x, heightAt(x, z) - .1, z);
    m.rotation.y = -Math.atan2(z1 - z0, x1 - x0);
  }
}
function gableRoof(w, d, h, m, x, y, z, rot = 0, p = scene) {
  const s = new THREE.Shape(); s.moveTo(-w / 2 - .5, 0); s.lineTo(w / 2 + .5, 0); s.lineTo(0, h); s.lineTo(-w / 2 - .5, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: d + 1, bevelEnabled: false }); g.translate(0, 0, -(d + 1) / 2);
  const r = add(g, m, x, y, z, p); r.rotation.y = rot; return r;
}
function house(x, z, w, d, floors = 1, rot = 0) {
  const g = new THREE.Group(); g.position.set(x, heightAt(x, z) - .2, z); g.rotation.y = rot; scene.add(g);
  const h = 3.4 * floors;
  box(w, h, d, 'wall', 0, 0, 0, g); box(w + .2, .35, d + .2, 'wallTrim', 0, 0, 0, g);
  gableRoof(w, d, Math.min(w, d) * .32, 'roof', 0, h, 0, 0, g);
  for (let f = 0; f < floors; f++) for (let i = -1; i <= 1; i += 2) {
    box(.8, 1.1, .1, 'window', i * w * .25, 1.4 + f * 3.4, d / 2 + .02, g);
    box(1.05, .18, .2, 'wallTrim', i * w * .25, 1.3 + f * 3.4, d / 2 + .05, g);
  }
  if (rnd() > .4) box(1.2, 2.1, .1, 'wood', 0, 0, d / 2 + .02, g);
  return g;
}
// striped awning texture
function stripeTex(a, b, n) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 8; const x = c.getContext('2d');
  for (let i = 0; i < n; i++) { x.fillStyle = i % 2 ? b : a; x.fillRect(i * 128 / n, 0, 128 / n + 1, 8); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function stall(x, z, face, cloth, goods) {
  const g = new THREE.Group(); g.position.set(x, heightAt(x, z), z); g.rotation.y = face; scene.add(g);
  for (const [a, b] of [[-1.8, -1.2], [1.8, -1.2], [-1.8, 1.2], [1.8, 1.2]]) box(.16, b > 0 ? 2.6 : 3.2, .16, 'wood', a, 0, b, g);
  const awn = add(new THREE.BoxGeometry(4.3, .08, 3.2), typeof cloth === 'string'
    ? new THREE.MeshStandardMaterial({ color: cloth, flatShading: true, roughness: 1 })
    : new THREE.MeshStandardMaterial({ map: cloth, roughness: 1 }), 0, 2.95, 0, g);
  awn.rotation.x = .19; awn.scale.y = 2;
  const val = add(new THREE.BoxGeometry(4.3, .45, .06), awn.material, 0, 2.55, 1.65, g);
  box(3.6, .12, 1.3, 'woodLt', 0, 1, .7, g); box(.12, 1, .12, 'wood', -1.6, 0, 1.2, g); box(.12, 1, .12, 'wood', 1.6, 0, 1.2, g);
  goods(g);
  return g;
}
const fruit = (g, c) => { for (let i = -1; i <= 1; i++) { cyl(.45, .35, .35, 7, 'basket', i * 1.1, 1.12, .7, g); for (let k = 0; k < 5; k++) add(new THREE.IcosahedronGeometry(.16, 0), mat('f' + c, c), i * 1.1 + R(-.2, .2), 1.55, .7 + R(-.2, .2), g); } };
const amph = (g, x, z, s = 1) => { const m = add(new THREE.LatheGeometry([[0, 0], [.18, .05], [.3, .4], [.32, .75], [.2, 1.05], [.1, 1.2], [.12, 1.35]].map(([a, b]) => new THREE.Vector2(a * s, b * s)), 8), 'clay', x, 0, z, g); };

// ---------- STATIONS (memory loci) ----------
const STATIONS = [];
const stationMat = new THREE.MeshStandardMaterial({ color: '#f0c46a', emissive: '#b8802a', emissiveIntensity: .6, flatShading: true });
function label(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128; const x = c.getContext('2d');
  x.fillStyle = 'rgba(244,234,214,.95)'; x.strokeStyle = '#b8583a'; x.lineWidth = 6;
  x.beginPath(); x.roundRect(6, 6, 244, 116, 18); x.fill(); x.stroke();
  x.fillStyle = '#3b2a1c'; x.font = 'bold 52px Georgia'; x.textAlign = 'center'; x.fillText(text, 128, 82);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: true })); s.scale.set(1.5, .75, 1); return s;
}
const VERSES = [29, 23, 25, 18];
const ZONE = ['The Market Street', 'The Temple Courtyard', 'The Family House', 'The Bridge & Road'];
function station(ch, room, name, x, z, look) {
  const v0 = (room - 1) * 5 + 1, v1 = Math.min(room * 5, VERSES[ch - 1]);
  const y = heightAt(x, z);
  cyl(.55, .7, .5, 8, 'stone', x, y, z);
  const gem = add(new THREE.OctahedronGeometry(.32, 0), stationMat, x, y + 1.0, z); gem.castShadow = false;
  const l = label(`${ch}:${v0}–${v1}`); l.position.set(x, y + 1.8, z); scene.add(l);
  STATIONS.push({ ch, room, name, x, z, look, gem, text: `Colossians ${ch}:${v0}–${v1}` });
}

// ---------- ZONE 1: gate + market street (Colossians 1, six stalls) ----------
const GZ = 78;
{ // city wall + gate
  const tower = (x) => { const g = new THREE.Group(); g.position.set(x, heightAt(x, GZ), GZ); scene.add(g);
    box(6, 10, 6, 'stone', 0, 0, 0, g);
    for (let i = -1; i <= 1; i++) for (const [a, b] of [[i * 2, 2.6], [i * 2, -2.6], [2.6, i * 2], [-2.6, i * 2]]) box(1, 1, 1, 'stoneDk', a, 10, b, g);
    box(.9, 1.6, .2, 'dark', 0, 6, 3.02, g); };
  tower(-6.5); tower(6.5);
  box(7, 3, 6, 'stone', 0, 6.5, GZ); for (let i = -2; i <= 2; i++) box(.9, .9, .9, 'stoneDk', i * 1.5, 9.5, GZ + 2.5);
  const arch = add(new THREE.TorusGeometry(3.5, .55, 6, 12, Math.PI), 'stoneDk', 0, 6.4, GZ + 3); arch.rotation.z = 0;
  stoneWall(-9.5, GZ, -70, GZ - 10, 4); stoneWall(-70, GZ - 10, -70, -40, 4); stoneWall(-70, -40, 46, -40, 4);
  stoneWall(9.5, GZ, 46, GZ - 10, 4); stoneWall(46, GZ - 10, 46, 8, 4); stoneWall(46, -4, 46, -40, 4);
}
const tex1 = stripeTex('#c1553b', '#efe2c4', 8), tex2 = stripeTex('#3f6f9a', '#efe7d4', 8), tex3 = stripeTex('#d9a640', '#c1553b', 6);
// road / cobbles
for (let z = GZ + 6; z > -2; z -= 1.6) for (let x = -3; x <= 3; x += 1.6) {
  if (rnd() < .18) continue;
  const m = add(new THREE.CylinderGeometry(R(.5, .65), R(.55, .7), .06, 6), 'cobble', x + R(-.3, .3), heightAt(x, z) - .01, z + R(-.3, .3)); m.rotation.y = R(0, 3);
}
const M1 = [
  [-7, 64, Math.PI / 2, '#b9573e', g => fruit(g, '#6b2f5a')],                    // figs
  [7, 64, -Math.PI / 2, tex1, g => { for (let i = 0; i < 5; i++) amph(g, -1.4 + i * .7, .7, .8); for (let i = 0; i < 3; i++) amph(g, -1 + i, -.6, 1.2); }],
  [-7, 52, Math.PI / 2, '#7d9a62', g => { ['#c94a3a', '#3f6f9a', '#e0b44a', '#efe6d4'].forEach((c, i) => box(.7, .5, .9, mat('w' + c, c), -1.2 + i * .8, 1.12, .7, g)); }],
  [7, 52, -Math.PI / 2, tex3, g => fruit(g, '#c43a2e')],                         // pomegranates
  [-7, 40, Math.PI / 2, '#efe2c4', g => { box(1.3, .6, .7, 'woodLt', 0, 1.12, .7, g); for (let i = 0; i < 4; i++) { const s = add(new THREE.CylinderGeometry(.1, .1, .9, 6), 'wool', -1.2 + i * .25 + (i > 1 ? 2 : 0), 1.25, .6, g); s.rotation.z = Math.PI / 2; } cyl(.12, .1, .2, 6, 'dark', .3, 1.75, .7, g); }],
  [7, 40, -Math.PI / 2, tex2, g => { cyl(.5, .55, .5, 10, 'woodLt', -1, 1.12, .7, g); for (let i = 0; i < 4; i++) cyl(.32, .18, .22, 8, 'clay', .2 + i * .45, 1.12, .7, g); }],
];
M1.forEach(([x, z, f, c, gd]) => stall(x, z, f, c, gd));
[['Fig Seller', -4.2, 64], ['Wine Jars', 4.2, 64], ['Wool Dyer', -4.2, 52], ['Pomegranates', 4.2, 52], ['Scribe’s Table', -4.2, 40], ['The Potter', 4.2, 40]]
  .forEach(([n, x, z], i) => station(1, i + 1, n, x, z, [x > 0 ? 9 : -9, 2, z]));
// well + olive tree + bench
{ const z = 58, x = 0;
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; const b = box(.7, .9, .5, 'stone', Math.cos(a) * 1.1, heightAt(0, z), z + Math.sin(a) * 1.1); b.rotation.y = -a; }
  box(.15, 2.2, .15, 'wood', -1, heightAt(0, z), z); box(.15, 2.2, .15, 'wood', 1, heightAt(0, z), z); box(2.3, .15, .15, 'wood', 0, heightAt(0, z) + 2.1, z);
  box(2.4, .2, .8, 'stone', 3.5, heightAt(3, z) + .45, z + 2.5); box(.3, .45, .6, 'stone', 2.6, heightAt(3, z), z + 2.5); box(.3, .45, .6, 'stone', 4.4, heightAt(3, z), z + 2.5);
  tree(2.5, z - 1.5, .9);
}
// houses lining the street
for (let z = 70; z > 22; z -= 9) for (const s of [-1, 1]) house(s * R(14, 15.5), z + R(-1, 1), R(7, 9), R(7, 8.5), rnd() > .5 ? 2 : 1, s > 0 ? -Math.PI / 2 : Math.PI / 2);

// ---------- ZONE 2: temple courtyard (Colossians 2) ----------
const TZ = 2;
{

STATIONS.forEach(st => { if (st.deck) { scene.children.filter(o => o.isSprite && Math.abs(o.position.x - st.x) < .01 && Math.abs(o.position.z - st.z) < .01).forEach(o => o.position.y = st.deck + 1.8); } });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__cam = (x, y, z, lx, ly, lz) => { overview = false; tween = null; window.__fixed = [x, y, z, lx, ly, lz]; };
const _r = renderer.render.bind(renderer);
renderer.render = (sc, cam) => { if (window.__fixed) { const [x, y, z, lx, ly, lz] = window.__fixed; cam.position.set(x, y, z); cam.lookAt(lx, ly, lz); } _r(sc, cam); };
frame();
window.__ready = true;
</script>
