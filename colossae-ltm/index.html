  let best = null, bd = 1e9; for (const st of STATIONS) { const d = Math.hypot(st.x - fpx, st.z - fpz); if (d < bd) { bd = d; best = st; } for (const lc of st.loci) { lc.gem.rotation.y = t; lc.gem.position.y = lc.gy + .65 + Math.sin(t * 2 + lc.x) * .07; } }

// fix station plinths that sit on the bridge deck
STATIONS.forEach(st => st.loci.forEach(lc => { lc.gy = groundY(lc.x, lc.z); lc.base.position.y = lc.gy + .08; lc.label.position.y = lc.gy + 1.15; }));

{
  scene.updateMatrixWorld(true);
