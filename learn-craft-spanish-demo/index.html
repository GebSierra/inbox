function barn(side){const{W,H,L,Z0}=BARN;const B=new THREE.Group();B.position.x=side*(1.95+W/2+.15);S.add(B);const zc=Z0-L/2;

  texBox(.2,1.05,bay,redMat,inner,.52,z,B,[bay/2.2,.45]);texBox(.2,.75,bay,redMat,inner,H-.37,z,B,[bay/2.2,.3]);

   texBox(.22,H-.55,.3,trimMat,-dw/2,(H-.55)/2,gz,B);texBox(.22,H-.55,.3,trimMat,dw/2,(H-.55)/2,gz,B);texBox(dw+.22,.22,.3,trimMat,0,H-.55,gz,B);

  }else texBox(W,H,.2,redMat,0,H/2,gz,B,[W/1.1,1]);

  for(let i=0;i<5;i++){const[a,b]=tp[i],[c,d]=tp[i+1];const len=Math.hypot(c-a,d-b);const t=texBox(len+.15,.2,.32,trimMat,(a+c)/2,(b+d)/2,gz+.04,B);t.rotation.z=Math.atan2(d-b,c-a)}

 // roof
