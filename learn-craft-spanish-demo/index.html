<style>
:root{--bg:#7fb6e6;--ink:#fff;--pad:rgba(255,255,255,.22)}

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}

 const b=new THREE.Group();b.position.y=1.05;A.add(b);{const c=mesh(ico2,woolMat,0,0,0,b);c.scale.set(.62,.72,.54)}

let yaw=0,pitch=-.06,mv={x:0,y:0};const keys={};onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null,lid=null,lx=0,ly=0;
addEventListener('pointerdown',e=>{const r=stick.getBoundingClientRect();
 if(e.clientX<r.right+30&&e.clientY>r.top-30&&sid===null){sid=e.pointerId;moveStick(e)}else if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}});

function blocked(x,z){for(const s of[-1,1]){const cx=s*(1.95+BARN.W/2+.15),hx=BARN.W/2+.35;if(Math.abs(x-cx)<hx&&z<BARN.Z0+.4&&z>BARN.Z0-BARN.L-.4)return true}return false}
