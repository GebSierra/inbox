<html lang="en"><head>

<title>Learn Craft Spanish</title>
<style>
:root{--bg:#7fb6e6;--ink:#fff;--pad:rgba(255,255,255,.22)}

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;color:var(--ink);text-shadow:0 1px 3px #0007;font-weight:700;pointer-events:none;font-size:15px}

#stick{position:fixed;left:24px;bottom:max(24px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:var(--pad);border:2px solid #fff9;backdrop-filter:blur(2px)}
