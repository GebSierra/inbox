<!doctype html>
<html><head><meta charset="utf-8"><title>Town NE preview</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { townNE } from '../engine/town-ne.js';
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256; const cx = cv.getContext('2d');
const gr = cx.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#3f5f9a'); gr.addColorStop(0.55, '#c9a0a0'); gr.addColorStop(0.85, '#ffb36a'); gr.addColorStop(1, '#ffc98a');
cx.fillStyle = gr; cx.fillRect(0, 0, 4, 256);
const bg = new THREE.CanvasTexture(cv); bg.colorSpace = THREE.SRGBColorSpace; scene.background = bg;
scene.fog = new THREE.Fog('#f0b78a', 120, 320);
scene.add(new THREE.HemisphereLight('#8fa5d8', '#b07848', 0.9));
const sun = new THREE.DirectionalLight('#ffb36b', 3.2); sun.position.set(-70, 32, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); const sc = sun.shadow.camera; sc.left = -80; sc.right = 100; sc.top = 60; sc.bottom = -60; sc.near = 10; sc.far = 260; sc.updateProjectionMatrix();
sun.shadow.bias = -0.0005; scene.add(sun);

let seed = 7; const R = (a, b) => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return a + (((t ^ (t >>> 14)) >>> 0) / 4294967296) * (b - a); };
const cache = {};
const heightAt = (x, z) => -z * 0.18 + Math.sin(x * 0.05) * 0.5;
const mesh = (geo, m, parent, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; (parent || scene).add(o); return o; };
const K = { THREE, scene, heightAt, R,
  mat(key, hex, opts = {}) { return cache[key] || (cache[key] = new THREE.MeshStandardMaterial({ color: hex, flatShading: true, roughness: 0.9, metalness: 0, ...opts })); },
  add: (g, m, x, y, z, p) => mesh(g, m, p, x, y, z),
  box: (w, h, d, m, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), m, p, x, y + h / 2, z),
  cyl: (rt, rb, h, s, m, x, y, z, p) => mesh(new THREE.CylinderGeometry(rt, rb, h, s), m, p, x, y + h / 2, z) };
for (const [k, c] of Object.entries({ wood: '#7a5230', woodLt: '#a67c4e', dark: '#2a2018', stone: '#b9a98a', stoneDk: '#8c7b60', marble: '#e8e0d0', wall: '#d8c49a', straw: '#c9a850', leaf: '#6a8f3c', basket: '#a07840' })) K.mat(k, c);

// ground (slope), x -45..50
const gg = new THREE.PlaneGeometry(100, 120, 40, 30); gg.rotateX(-Math.PI / 2); gg.translate(2.5, 0, 0);
const gp = gg.attributes.position; for (let i = 0; i < gp.count; i++) gp.setY(i, heightAt(gp.getX(i), gp.getZ(i)) - 0.02);
gg.computeVertexNormals();
const ground = new THREE.Mesh(gg, K.mat('ground', '#cdb27a')); ground.receiveShadow = true; scene.add(ground);
const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), K.mat('water', '#4a95b8', { roughness: 0.4 })); water.rotation.x = -Math.PI / 2; water.position.set(85, -4, 25); water.receiveShadow = true; scene.add(water);

const T = townNE(K);
const stats = {}; const tris = o => { let n = 0; o.traverse(m => { if (m.isMesh) { const g = m.geometry; n += (g.index ? g.index.count : g.attributes.position.count) / 3; } }); return n; };
const spec = [[6, 5, 1], [8, 6, 2], [7, 7, 1], [9, 6, 3], [5.5, 5, 1], [8, 8, 2], [6, 6, 2], [10, 7, 1], [7, 6, 3]];
stats.houses = [];
spec.forEach(([w, d, f], i) => { const x = -28 + (i % 3) * 18, z = -30 + Math.floor(i / 3) * 16; const hh = T.neHouse(x, z, w, d, f, 0); stats.houses.push(tris(hh)); (stats.stairs = stats.stairs || []).push(hh.userData.stair ? 1 : 0); });
stats.palms = [tris(T.palm(-36, 6, 1)), tris(T.palm(-33, 10, 1.2))];
stats.ship = tris(T.ship(80, -3.6, 25, 0.6));
stats.lighthouse = tris(T.lighthouse(46, 10));
stats.maxHouse = Math.max(...stats.houses); stats.maxPalm = Math.max(...stats.palms);
window.__stats = stats;

const cam = new THREE.PerspectiveCamera(45, W / H, 0.5, 600);
window.__view = (name) => {
  if (name === 'wide') { cam.position.set(-10, 42, 78); cam.lookAt(20, 0, -5); }
  else if (name === 'street') { cam.position.set(-40, 3.5, 14); cam.lookAt(-6, 4, -14); }
  else { cam.position.set(66, 9, 44); cam.lookAt(80, 2, 25); }
  cam.fov = name === 'street' ? 62 : 45; cam.updateProjectionMatrix(); renderer.render(scene, cam);
};
window.__view('wide'); window.__ready = true;
</script></body></html>
