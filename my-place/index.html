<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>My Place</title>
<style>
:root{--mist:#d9dee0;--ink:#eef2f1;--glass:rgba(20,30,28,.38);--edge:rgba(255,255,255,.35);color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#9aa4a6;color:var(--ink);font-family:Georgia,"Times New Roman",serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#title{position:fixed;left:0;right:0;top:calc(18% + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;transition:opacity 2.5s}
#title h1{font-weight:400;font-style:italic;font-size:clamp(40px,9vw,88px);margin:0;letter-spacing:.02em;text-shadow:0 2px 30px rgba(0,0,0,.35)}
#title p{font:12px/1.4 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;opacity:.85}
#start{pointer-events:auto;margin-top:18px;font:14px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--edge);padding:12px 26px;border-radius:30px;cursor:pointer;backdrop-filter:blur(6px)}
#joy{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(4px)}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#hint{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));font:12px system-ui,sans-serif;opacity:.75;text-align:right;pointer-events:none;max-width:200px}
#places{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
#sit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));font:14px system-ui,sans-serif;letter-spacing:.08em;color:var(--ink);background:var(--glass);border:1px solid var(--edge);padding:10px 22px;border-radius:24px;cursor:pointer;backdrop-filter:blur(6px)}
#places button{font:12px system-ui,sans-serif;letter-spacing:.06em;color:var(--ink);background:var(--glass);border:1px solid var(--edge);padding:7px 12px;border-radius:20px;cursor:pointer;backdrop-filter:blur(6px)}
#places button:focus-visible,#start:focus-visible{outline:2px solid #fff;outline-offset:2px}
#fade{position:fixed;inset:0;background:#cfd6d8;opacity:0;pointer-events:none;transition:opacity .45s}
#ring{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s,transform .6s}
#credit{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));text-align:center;font:10px system-ui,sans-serif;opacity:.55;pointer-events:none}#credit a{color:inherit;pointer-events:auto}
#start:disabled{opacity:.6;cursor:wait}
</style>
</head><body>
<div id="title"><h1>My Place</h1><p>Prototype · alpine falls</p><button id="start" type="button" disabled>Loading the valley…</button></div>
<div id="joy"><div id="knob"></div></div>
<nav id="places" aria-label="Places"><button type="button" data-p="falls">Waterfall</button><button type="button" data-p="trail">Trail</button><button type="button" data-p="lake">Lake</button><button type="button" data-p="cabin">Cabin</button><button type="button" id="fireBtn" aria-pressed="false">Light campfire</button></nav>
<button id="sit" type="button" hidden>Sit up</button><div id="fade"></div><div id="ring"></div>
<div id="hint">Joystick or WASD to walk · drag to look · double-tap to go there</div>
<div id="credit">Textures and models: Poly Haven (CC0). Grass: “Low Poly Tree Scene Free” by Nicholas-3D, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const A='assets/';
const TL=new THREE.TextureLoader();
function tex(name,srgb){const t=TL.load(A+'tex/'+name);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
const pending=[];

// ---------- noise ----------
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const P=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)P[i]=p[i&255]}
const hsh=(x,y)=>P[(P[x&255]+y)&255]/255;
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hsh(xi,yi),b=hsh(xi+1,yi),c=hsh(xi,yi+1),d=hsh(xi+1,yi+1);return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

// ---------- world shape ----------
const FALL_Z=-178;
const riverX=z=>Math.sin(z*.018)*10+Math.sin(z*.05)*3;
// lake basin behind the start point
const LZ=370,LRX=150,LRZ=110;
const shoreOf=(x,z)=>Math.hypot(x/LRX,(z-LZ)/LRZ)-1;   // <0 water, 0 waterline
const lakeMix=z=>sm(195,255,z);
const CABIN={x:-52,z:251};
// woodland trail from the gorge to the beach, along the east bank
const pathX=z=>riverX(Math.min(z,235))+13+Math.sin(z*.035)*4+sm(200,248,z)*(20-riverX(235)-13);
const onPath=(x,z,w)=>z>-150&&z<252&&Math.abs(x-pathX(z))<w;
function lakeH(x,z){const s=shoreOf(x,z);
 if(s<0)return -.6+s*9;
 return s*5+sm(.15,.7,s)*(9+fbm(x*.02,z*.02)*8)+Math.max(0,s-.6)*12+fbm(x*.12,z*.12)*.3*sm(.1,.3,s);}
// island at the river mouth, reached over stepping stones from the east beach
const ISL={x:-6,z:297,r:10},CW=[{x:16,z:257},{x:-1,z:288}];
const segD=(x,z,a,b)=>{const vx=b.x-a.x,vz=b.z-a.z,t=Math.max(0,Math.min(1,((x-a.x)*vx+(z-a.z)*vz)/(vx*vx+vz*vz)));return Math.hypot(x-a.x-vx*t,z-a.z-vz*t)};
const mouthClear=(x,z)=>z>185&&z<300&&Math.abs(x-riverX(Math.min(z,262)))<26;
function H(x,z){const lm=lakeMix(z);let h;
 if(lm<=0)return G0(x,z);
 if(lm>=1)h=lakeH(x,z);else{const g=G0(x,z);h=g+(lakeH(x,z)-g)*lm}
 if(z<292){const d=Math.abs(x-riverX(Math.min(z,262)));const w=1-sm(268,292,z);   // river mouth channel opens into the lake
  h=Math.min(h,h+(Math.max(-1.6+sm(9,22,d)*5,h-(1-sm(10,26,d))*30)-h)*w)}
 if(z>270){const ri=Math.hypot(x-ISL.x,z-ISL.z);if(ri<16)h=Math.max(h,1.5-ri*ri*.017+fbm(x*.2,z*.2)*.35);
  if(segD(x,z,CW[0],CW[1])<1.5)h=Math.max(h,-.68)}
 return h}
function G0(x,z){
 const d=Math.abs(x-riverX(z));
 let h=-1.6+fbm(x*.1,z*.1)*.5;
 h+=sm(9,22,d)*5;
 const w=Math.max(0,d-32);h+=w*w*.01+w*.45;
 h+=fbm(x*.03,z*.03)*7*sm(15,45,d)+fbm(x*.15,z*.15)*1.3*sm(8,14,d);
 const c=sm(-158,-196,z);
 h+=c*(88+fbm(x*.06,z*.06)*12)-c*(1-sm(4,16,d))*5;
 return h;
}
const slope=(x,z)=>Math.hypot(H(x+1,z)-H(x-1,z),H(x,z+1)-H(x,z-1))/2;

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const FOG=new THREE.Color(0xaab3b4);scene.background=FOG;scene.fog=new THREE.FogExp2(FOG,.0042);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,4000);
const hemi=new THREE.HemisphereLight(0xdfe6e8,0x2c3326,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xf0f2ee,.7);sun.position.set(220,150,420);scene.add(sun);
// overcast HDRI drives image-based lighting
{const pm=new THREE.PMREMGenerator(renderer);
 pending.push(new RGBELoader().loadAsync(A+'sky/overcast_soil_puresky_1k.hdr').then(hdr=>{scene.environment=pm.fromEquirectangular(hdr).texture;hdr.dispose()}).catch(()=>{}));}

// ---------- terrain ----------
let terrain;
{const g=new THREE.PlaneGeometry(600,830,280,400);g.rotateX(-Math.PI/2);g.translate(0,0,105);
 const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,H(p.getX(i),p.getZ(i)));
 g.computeVertexNormals();const n=g.attributes.normal,col=[],bch=[];const c=new THREE.Color();
 // vertex colour = splat weights: r rock, g grass/moss, b forest-floor leaves
 for(let i=0;i<p.count;i++){const ny=n.getY(i),x=p.getX(i),z=p.getZ(i),k=fbm(x*.08,z*.08);
  const d=Math.abs(x-riverX(z));
  let r=Math.max(1-sm(.68,.86,ny),1-sm(9,13,d));
  let l=sm(24,40,d+k*10)*(1-r);
  const lm=lakeMix(z),sh=shoreOf(x,z),r2=1-sm(.68,.86,ny),l2=sm(.25,.45,sh+k*.1)*(1-r2);
  r+= (r2-r)*lm;l+=(l2-l)*lm;let gr=Math.max(0,1-r-l);
  col.push(r,gr,l);bch.push(Math.max(lm*(1-sm(.1,.19,sh+k*.03)),onPath(x,z,3.2)?(1-sm(1.4,3.2,Math.abs(x-pathX(z))+k))*.9:0))}
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setAttribute('beach',new THREE.Float32BufferAttribute(bch,1));
 const mat=new THREE.MeshStandardMaterial({roughness:.95,normalMap:tex('dark_rock_nor_gl.jpg'),normalScale:new THREE.Vector2(.8,.8)});
 const tS=tex('gravel_diff.jpg',1),tR=tex('dark_rock_diff.jpg',1),tG=tex('grass_ground_diff.jpg',1),tLf=tex('forest_leaves_02_diff.jpg',1);
 mat.onBeforeCompile=s=>{Object.assign(s.uniforms,{tS:{value:tS},tR:{value:tR},tG:{value:tG},tLf:{value:tLf}});
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;varying vec3 vSplat;varying float vBeach;attribute vec3 color;attribute float beach;')
   .replace('#include <begin_vertex>','#include <begin_vertex>\nvWP=(modelMatrix*vec4(position,1.)).xyz;vWN=normal;vSplat=color;vBeach=beach;');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D tS,tR,tG,tLf;varying vec3 vWP;varying vec3 vWN;varying vec3 vSplat;varying float vBeach;')
   .replace('#include <map_fragment>',`
    vec3 an=abs(normalize(vWN));an/=an.x+an.y+an.z;
    vec3 rock=texture2D(tR,vWP.zy*.08).rgb*an.x+texture2D(tR,vWP.xz*.08).rgb*an.y+texture2D(tR,vWP.xy*.08).rgb*an.z;
    rock*=mix(.75,1.15,texture2D(tR,vWP.xz*.011).g);
    vec3 grass=texture2D(tG,vWP.xz*.12).rgb*mix(.8,1.1,texture2D(tG,vWP.xz*.013).g);
    vec3 leaf=texture2D(tLf,vWP.xz*.14).rgb*.8;
    vec3 sp=vSplat/max(.001,vSplat.r+vSplat.g+vSplat.b);
    // wet darkening near the waterline
    float wet=1.-smoothstep(.2,2.2,vWP.y);
    vec3 sand=texture2D(tS,vWP.xz*.18).rgb;sand=mix(vec3(dot(sand,vec3(.34))),sand,.4)*mix(.8,1.1,texture2D(tS,vWP.xz*.02).r);
    vec3 base=(rock*sp.r+grass*sp.g+leaf*sp.b)*mix(1.,.55,wet);
    diffuseColor.rgb=mix(base,sand*mix(1.,.6,1.-smoothstep(-.6,.25,vWP.y)),vBeach);`)
   .replace('#include <normal_fragment_maps>','#if 0\n#include <normal_fragment_maps>\n#endif\n{vec3 mn=texture2D(normalMap,vWP.xz*.08).xyz*2.-1.;normal=normalize(normal+(vSplat.r*.9+.2)*vec3(mn.x,mn.y,0.)*normalScale.x*.5);}');};
 terrain=new THREE.Mesh(g,mat);scene.add(terrain);}

// ---------- shared GLSL noise ----------
const GN=`float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}`;
const U={t:{value:0}};

// ---------- river ----------
{const segZ=260,segX=40,pos=[],uv=[],idx=[];
 for(let j=0;j<=segZ;j++){const z=262-j*(262+166)/segZ;for(let i=0;i<=segX;i++){const u=(i/segX-.5)*26;
  pos.push(riverX(z)+u,0,z);uv.push(u,z)}}
 for(let j=0;j<segZ;j++)for(let i=0;i<segX;i++){const a=j*(segX+1)+i,b=a+segX+1;idx.push(a,b,a+1,b,b+1,a+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
 const m=new THREE.ShaderMaterial({uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{t:U.t}]),fog:true,side:THREE.DoubleSide,transparent:true,
 vertexShader:`${GN}uniform float t;varying vec2 vUv;varying float vF;varying vec3 vW;
 #include <fog_pars_vertex>
 void main(){vUv=uv;vec3 p=position;float f=fb(vec2(uv.x*.25,uv.y*.12-t*1.6));
  p.y+=-.45+f*.35+fb(vec2(uv.x*.6,uv.y*.5-t*4.))*.18;vF=f;vec4 mvPosition=modelViewMatrix*vec4(p,1.);vW=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*mvPosition;
  #include <fog_vertex>
 }`,
 fragmentShader:`${GN}uniform float t;varying vec2 vUv;varying float vF;varying vec3 vW;
 #include <fog_pars_fragment>
 void main(){vec2 q=vec2(vUv.x*.35,vUv.y*.18-t*2.2);
  float foam=fb(q+fb(q*1.7+t*.3))*1.1;foam+=fb(vec2(vUv.x*1.4,vUv.y*.9-t*7.))*.5;
  float edge=smoothstep(4.,10.,abs(vUv.x));foam=smoothstep(.88,1.2,foam+edge*.25+(vUv.y<-150.?.4:0.));
  vec3 deep=vec3(.20,.26,.26),white=vec3(.93,.95,.95);
  vec3 c=mix(deep,white,foam);vec3 n=normalize(cross(dFdx(vW),dFdy(vW)));
  float spec=pow(max(dot(reflect(normalize(vW-cameraPosition),n),normalize(vec3(-.4,.8,.5))),0.),30.)*.4;
  float mouth=smoothstep(232.,261.,vUv.y);c=mix(c,deep*.6,mouth*.7);gl_FragColor=vec4(c+spec,1.-mouth);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
  #include <fog_fragment>
 }`});
 m.uniforms.t=U.t;scene.add(new THREE.Mesh(g,m));}

// ---------- waterfall ----------
{const rows=120,cols=30,pos=[],uv=[],idx=[];
 for(let j=0;j<=rows;j++){const z=-152-j*(52/rows);const width=10+sm(-200,-160,z)*14;
  for(let i=0;i<=cols;i++){const s=i/cols-.5,x=riverX(z)+s*width;pos.push(x,H(x,z)+.9+ (1-Math.abs(s)*2)*1.2,z);uv.push(s,j/rows)}}
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=j*(cols+1)+i,b=a+cols+1;idx.push(a,b,a+1,b,b+1,a+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
 const m=new THREE.ShaderMaterial({uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{t:U.t}]),fog:true,transparent:true,depthWrite:false,side:THREE.DoubleSide,
 vertexShader:`varying vec2 vUv;
 #include <fog_pars_vertex>
 void main(){vUv=uv;vec4 mvPosition=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mvPosition;
 #include <fog_vertex>
 }`,
 fragmentShader:`${GN}uniform float t;varying vec2 vUv;
 #include <fog_pars_fragment>
 void main(){float s=fb(vec2(vUv.x*14.,vUv.y*3.+t*2.6))*.7+fb(vec2(vUv.x*40.,vUv.y*6.+t*4.))*.5;
  float e=1.-smoothstep(.25+fb(vec2(vUv.y*4.,t*.5))*.2,.5,abs(vUv.x));
  float a=e*smoothstep(.25,.75,s)*.95+e*.15;
  gl_FragColor=vec4(vec3(.9,.93,.94)+s*.08,clamp(a,0.,1.));
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
  #include <fog_fragment>
 }`});
 m.uniforms.t=U.t;scene.add(new THREE.Mesh(g,m));}

// ---------- rocks ----------
function rockGeo(s){const g=new THREE.IcosahedronGeometry(1,3),p=g.attributes.position,v=new THREE.Vector3();
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=fbm(v.x*1.2+s,v.y*1.2+v.z,3);
  v.multiplyScalar(1+n*.45);v.y*=.62;if(v.y<-.2)v.y=-.2+(v.y+.2)*.3;
  // facet the top like split granite
  const f=Math.max(v.x*.5+v.y,0);v.y-=f*.15;p.setXYZ(i,v.x,v.y,v.z)}g.computeVertexNormals();return g}
{const geos=[rockGeo(1),rockGeo(9)],mat=new THREE.MeshStandardMaterial({map:tex('dark_rock_diff.jpg',1),normalMap:tex('dark_rock_nor_gl.jpg'),roughness:.6,metalness:0});
 const N=900;const ms=geos.map(g=>new THREE.InstancedMesh(g,mat,N));
 const o=new THREE.Object3D(),c=new THREE.Color();let k=[0,0];
 const add=(x,z,s,y,force)=>{if(!force&&(Math.hypot(x-riverX(-10)-9.5,z+10)<5||onPath(x,z,2.5)||mouthClear(x,z)))return;const which=rnd()<.5?0:1;o.position.set(x,y??H(x,z)-s*.15,z);
  o.rotation.set(rnd()*.3,rnd()*6.28,rnd()*.3);o.scale.set(s*(.8+rnd()*.6),s*(.7+rnd()*.6),s*(.8+rnd()*.6));o.updateMatrix();
  const m=ms[which];if(k[which]>=N)return;m.setMatrixAt(k[which],o.matrix);const g=.75+rnd()*.45;c.setRGB(g,g,g*1.02);m.setColorAt(k[which]++,c)};
 for(let i=0;i<550;i++){const z=-165+rnd()*415,side=rnd()<.5?-1:1,d=10+Math.pow(rnd(),1.4)*10;
  const x=riverX(z)+side*d;add(x,z,.4+rnd()*rnd()*2.4)}
 for(let i=0;i<50;i++){const z=-160+rnd()*400,x=riverX(z)+(rnd()-.5)*14;add(x,z,.4+rnd()*1.1,-1.1)}
 // hero boulders near start, right bank, like the video
 add(riverX(30)+8,30,5.5);add(riverX(22)+10,22,3);add(riverX(40)-11,40,3.5);
 for(let i=0;i<500;i++){const a=rnd()*6.283,e=1+.01+rnd()*.15;const x=Math.cos(a)*LRX*e,z=LZ+Math.sin(a)*LRZ*e;if(z>300||Math.hypot(x-CABIN.x,z-CABIN.z)<14)continue;add(x,z,.08+rnd()*rnd()*.6)}

 const uvA=[];for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++)uvA.push(i/nu*3,j/nv);g.setAttribute('uv',new THREE.Float32BufferAttribute(uvA,2));

// ---------- player & controls ----------

const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jv={x:0,y:0},jid=null;
function joyMove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-65,dy=e.clientY-r.top-65;const l=Math.hypot(dx,dy),m=45;if(l>m){dx*=m/l;dy*=m/l}

// double-tap (or double-click) the ground to walk there

cv.addEventListener('pointerdown',e=>{const now=performance.now();
 if(now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const ch=ray.intersectObject(canoe,true)[0];
  if(ch&&ch.distance<60){enterCanoe();lastTap.t=0;return}
  const hit=ray.intersectObjects([terrain,lake],false)[0];
  if(hit){target={x:hit.point.x,z:hit.point.z};ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px';ring.style.transition='none';ring.style.opacity=1;ring.style.transform='scale(.6)';
   requestAnimationFrame(()=>{ring.style.transition='opacity .7s,transform .7s';ring.style.opacity=0;ring.style.transform='scale(1.6)'})}
  lastTap.t=0}else lastTap={t:now,x:e.clientX,y:e.clientY}});
const PLACES={falls:{x:riverX(-140)+16,z:-140,yaw:.05,pitch:.18},trail:{x:pathX(150),z:150,yaw:3.0,pitch:0},
 lake:{x:24,z:249,yaw:3.14,pitch:.03},cabin:{x:CABIN.x+10,z:CABIN.z+14,yaw:-2.5,pitch:0}};
PLACES.cabin.yaw=Math.atan2(-(CABIN.x-PLACES.cabin.x),-(CABIN.z-PLACES.cabin.z));
const fade=document.getElementById('fade');const fireBtn=document.getElementById('fireBtn');
fireBtn.addEventListener('click',()=>setFire(!fireOn));
document.querySelectorAll('#places button[data-p]').forEach(b=>b.addEventListener('click',()=>{fade.style.opacity=1;target=null;
 setTimeout(()=>{Object.assign(player,PLACES[b.dataset.p]);if(inCanoe){inCanoe=false;sitBtn.hidden=true}fade.style.opacity=0},460)}));

// ---------- sound: synthesized roar ----------
let audio=null;
document.getElementById('start').onclick=()=>{
 try{const ac=new AudioContext();const len=ac.sampleRate*4,b=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5+w*.25}}
  const mk=(f,q)=>{const s=ac.createBufferSource();s.buffer=b;s.loop=true;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=0;s.connect(fl).connect(g).connect(ac.destination);s.start();return g};
  audio={fall:mk(500,.3),river:mk(1800,.2)};
  const loop=async(f)=>{const g=ac.createGain();g.gain.value=0;g.connect(ac.destination);
   try{const buf=await ac.decodeAudioData(await (await fetch(A+'audio/'+f)).arrayBuffer());const src=ac.createBufferSource();src.buffer=buf;src.loop=true;src.connect(g);src.start()}catch(e){}return g};
  loop('lake.mp3').then(g=>audio.lake=g);loop('campfire.mp3').then(g=>audio.fire=g)}catch(e){}
 const t=document.getElementById('title');t.style.opacity=0;document.getElementById('hint').textContent='Follow the trail on the right bank back to the lake';setTimeout(()=>t.hidden=true,2600)};

Promise.allSettled(pending).then(()=>{const b=document.getElementById('start');b.disabled=false;b.textContent='Enter with sound'});

// ---------- loop ----------
const clock=new THREE.Clock();const GREY=new THREE.Color(0xaab3b4),HAZE=new THREE.Color(0xc7d3dc),WHITE=new THREE.Color(0xf0f2ee),WARM=new THREE.Color(0xffe2bd);
// lying in the canoe: look up at the sky; any movement gets you back up on the island
let inCanoe=false;const sitBtn=document.getElementById('sit');
function enterCanoe(){fade.style.opacity=1;target=null;setTimeout(()=>{inCanoe=true;player.pitch=.85;player.yaw=CANOE.heading+Math.PI/2;sitBtn.hidden=false;fade.style.opacity=0},460)}
function leaveCanoe(){inCanoe=false;sitBtn.hidden=true;player.x=POST.x-2;player.z=POST.z+1;player.pitch=0}
sitBtn.addEventListener('click',()=>{fade.style.opacity=1;setTimeout(()=>{leaveCanoe();fade.style.opacity=0},460)});
// walkable: not too steep, inside the world, not in deep lake water, not inside the cabin
const walkable=(x,z)=>slope(x,z)<1.6&&z>-158&&z<480&&Math.abs(x)<270&&!(lakeMix(z)>.5&&H(x,z)<-.75)&&Math.hypot(x-CABIN.x,z-CABIN.z)>3.6;
// never trap the player: from an invalid spot any move is allowed
function tryMove(x,z){if(walkable(x,z)||!walkable(player.x,player.z)){player.x=x;player.z=z;return true}return false}
function frame(){const dt=Math.min(clock.getDelta(),.05);U.t.value+=dt;
 let f=-jv.y,s=jv.x;
 if(Math.hypot(f,s)>.1||keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD||keys.ArrowUp||keys.ArrowDown)target=null;
 if(target){const dx=target.x-player.x,dz=target.z-player.z,dist=Math.hypot(dx,dz);
  if(dist<1)target=null;else{const v=Math.min(16,dist*3)*dt/dist;tryMove(player.x+dx*v,player.z+dz*v)||(target=null)}}if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA)s-=1;if(keys.KeyD)s+=1;
 if(keys.ArrowLeft)player.yaw+=dt*1.5;if(keys.ArrowRight)player.yaw-=dt*1.5;
 const sp=(keys.ShiftLeft?14:6)*dt,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
 const nx=player.x+(-sy*f+cy*s)*sp,nz=player.z+(-cy*f-sy*s)*sp;
 updateCanoe(U.t.value);
 fireLight.intensity=fireOn?7+Math.sin(U.t.value*13)*1.2+Math.sin(U.t.value*7.3)*1.5:0;
 if(inCanoe&&(Math.abs(f)>.3||Math.abs(s)>.3))leaveCanoe();
 if(!inCanoe&&(f||s))tryMove(nx,nz);
 const gy=Math.max(H(player.x,player.z),.3)+1.7,bob=Math.sin(U.t.value*8)*.04*Math.min(1,Math.hypot(f,s));
 camera.position.set(player.x,gy+bob,player.z);
 if(inCanoe){const c=new THREE.Vector3(-.9,.28,0).applyMatrix4(canoe.matrixWorld);camera.position.copy(c)}
 camera.rotation.set(player.pitch,player.yaw,0,'YXZ');
 if(audio){const df=Math.hypot(player.x-fx,player.z+170),dr=Math.abs(player.x-riverX(player.z));
  const lm=lakeMix(player.z);audio.fall.gain.value=Math.min(1,60/df)*.9;audio.river.gain.value=Math.min(.5,6/(dr+4))*.5*(1-lm*.85);
  if(audio.lake)audio.lake.gain.value=lm*Math.min(1,10/(Math.abs(shoreOf(player.x,player.z))*120+6))*.9;
  if(audio.fire)audio.fire.gain.value=fireOn?Math.min(1,5/(Math.hypot(player.x-FIRE.x,player.z-FIRE.z)+1))*.9:0}
 // weather: misty overcast in the gorge, clear and sunny at the lake
 const k=sm(110,245,player.z);
 scene.fog.color.lerpColors(GREY,HAZE,k);scene.fog.density=.0042+(.00045-.0042)*k;skyU.oc.value=.55*(1-k);
 sun.intensity=.7+k*2.1;sun.color.lerpColors(WHITE,WARM,k);hemi.intensity=.55+k*.45;renderer.toneMappingExposure=1.05-k*.12;
 sky.position.copy(camera.position);
 composer.render();requestAnimationFrame(frame)}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
